# Render Blueprint — deploy in ~2 clicks.
# 1. Push this folder to GitHub
# 2. Render dashboard → New → Blueprint → pick the repo → deploy
# 3. Add the two VAPID env vars below (values in README / chat)
services:
  - type: web
    name: chat-boy-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
