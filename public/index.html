<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#14110c"/>
<title>Chat Boy AI</title>
<link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" href="/icon.svg"/>
<link rel="apple-touch-icon" href="/icon-180.png"/>
<style>
  @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900; font-display: swap; src: url('/fonts/inter-var.woff2') format('woff2'); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #14110c; --panel: #1d1812; --bubble-bot: #26211a; --bubble-me: #e8a33d;
    --text: #f3eee3; --muted: #a79c8c; --line: rgba(243,238,227,.1);
    --chip: #2a241b; --sysbg: rgba(243,238,227,.06);
    --accent: #e8a33d; --accent-text: #e8a33d; --accent-ink: #211806;
  }
  [data-theme="light"] {
    --bg: #f4eee1; --panel: #fcf9f1; --bubble-bot: #e8dfcb; --bubble-me: #e8a33d;
    --text: #221b10; --muted: #837768; --line: rgba(34,27,16,.12);
    --chip: #eae1cc; --sysbg: rgba(34,27,16,.05);
    --accent: #e8a33d; --accent-text: #96650f; --accent-ink: #211806;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    display: flex; justify-content: center;
  }
  #app { width: 100%; max-width: 560px; height: 100dvh; display: flex; flex-direction: column; position: relative; }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
  }
  .logo {
    width: 44px; height: 44px; border-radius: 14px; font-size: 26px;
    background: var(--accent);
    display: flex; align-items: center; justify-content: center;
    user-select: none; cursor: pointer; flex-shrink: 0;
  }
  .title { flex: 1; min-width: 0; }
  .title h1 { font-size: 18px; margin: 0; font-family: Georgia, 'Times New Roman', serif; letter-spacing: .3px; }
  .title p { font-size: 12px; margin: 2px 0 0; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #57b26a; display: inline-block; }
  .dot.away { background: #6e655a; }
  .actions { display: flex; gap: 4px; }
  .icon-btn { background: none; border: 0; padding: 8px; cursor: pointer; color: var(--text); border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: background .15s, transform .1s; }
  .icon-btn:hover { background: var(--chip); }
  .icon-btn:active { transform: scale(.92); }
  .hidden { display: none !important; }
  main#chat { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 18px; font-size: 15px; line-height: 1.45; word-wrap: break-word; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .msg.bot { background: var(--bubble-bot); border-bottom-left-radius: 6px; align-self: flex-start; }
  .msg.me { background: var(--bubble-me); border-bottom-right-radius: 6px; align-self: flex-end; color: var(--accent-ink); font-weight: 500; }
  .msg.sys { align-self: center; background: var(--sysbg); font-size: 12px; color: var(--muted); border-radius: 12px; }
  .msg .quote { background: rgba(0,0,0,.18); border-radius: 10px; padding: 6px 10px; margin-bottom: 6px; font-size: 12.5px; line-height: 1.35; }
  .msg.me .quote { background: rgba(33,24,6,.14); }
  .msg .quote b { display: block; font-size: 11px; opacity: .85; margin-bottom: 1px; }
  .editedMark { font-size: 10px; opacity: .65; margin-left: 6px; white-space: nowrap; }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }
  #chips { display: flex; gap: 8px; padding: 0 14px 8px; overflow-x: auto; }
  #chips button {
    flex-shrink: 0; background: var(--chip); color: var(--text);
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  #replyBar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--panel); font-size: 13px; }
  #replyBar .q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #replyCancel { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px 8px; }
  #jumpBtn {
    position: absolute; bottom: 148px; left: 50%; transform: translateX(-50%); z-index: 6;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
    padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,.3); white-space: nowrap;
  }
  form#composer { display: flex; gap: 8px; padding: 10px 14px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  #input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    border-radius: 999px; padding: 12px 16px; font-size: 15px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    width: 48px; height: 48px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); flex-shrink: 0;
  }
  #sheetWrap { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  #sheet {
    width: 100%; max-width: 560px; background: var(--panel); border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
    animation: up .25s ease-out;
  }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  #sheet h2 { margin: 0 0 4px; font-size: 18px; }
  #sheet .muted { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
  #sheet input {
    width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: none; margin-bottom: 12px;
  }
  #sheet input:focus { border-color: var(--accent); }
  .btn {
    width: 100%; border: 0; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; margin-bottom: 8px;
  }
  .btn.ghost { background: var(--chip); color: var(--text); font-weight: 600; }
  #sessInfo { background: rgba(232,163,61,.1); border: 1px solid rgba(232,163,61,.3); border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 12px; }
  #sessInfo code { color: var(--accent-text); font-size: 15px; letter-spacing: 2px; }
  #editBar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--panel); font-size: 13px; }
  #editBar .q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  #editBar .tag { color: var(--accent-text); font-weight: 700; white-space: nowrap; }
  #editCancel { background: none; border: 0; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px 8px; }
  #msgSheetWrap { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 25; display: flex; align-items: flex-end; justify-content: center; }
  #msgSheet { width: 100%; max-width: 560px; background: var(--panel); border-radius: 24px 24px 0 0; padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); animation: up .25s ease-out; }
  #msgSheetPreview { font-size: 13px; color: var(--muted); padding: 6px 10px 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .msgBtn { display: flex; align-items: center; gap: 12px; width: 100%; background: none; border: 0; color: var(--text); font-size: 16px; padding: 14px 10px; border-radius: 12px; cursor: pointer; text-align: left; }
  .msgBtn:active { background: var(--chip); }
  #swipeHint { position: absolute; z-index: 6; font-size: 22px; opacity: 0; pointer-events: none; transition: opacity .1s; }
  .seenMark { display: block; font-size: 10px; opacity: .65; margin-top: 3px; text-align: right; }
  .seenMark.isSeen { opacity: .95; }
  .icon-btn svg { width: 22px; height: 22px; display: block; }
  .logo svg { width: 26px; height: 26px; display: block; }
  .msg.bot, .msg.me { box-shadow: 0 1px 3px rgba(0,0,0,.28); }
  #replyBar svg, #editBar svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--muted); }
  #editBar .tag { display: flex; align-items: center; gap: 5px; }
  #replyCancel svg, #editCancel svg { width: 14px; height: 14px; display: block; }
  #send { display: flex; align-items: center; justify-content: center; transition: transform .1s; }
  #send:active { transform: scale(.9); }
  #send svg { width: 20px; height: 20px; display: block; }
  .msgBtn svg { width: 20px; height: 20px; flex-shrink: 0; opacity: .9; }
  .msgBtn:hover { background: var(--chip); }
  #chips button:hover { border-color: var(--accent); }
  #jumpBtn { display: flex; align-items: center; gap: 6px; }
  #jumpBtn svg { width: 15px; height: 15px; }
  #swipeHint svg { width: 26px; height: 26px; display: block; color: var(--accent); }
  input, button { font-family: inherit; }
  main#chat { scrollbar-width: thin; }
  main#chat::-webkit-scrollbar { width: 8px; }
  main#chat::-webkit-scrollbar-thumb { background: rgba(167,156,140,.4); border-radius: 8px; }
  #alertBar { display: flex; flex-direction: column; }
  .alertRow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 13px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--text); }
  .alertRow.danger { background: rgba(229,72,77,.12); }
  .alertRow span { flex: 1; }
  .alertRow button { flex-shrink: 0; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 6px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .alertRow .alertX { background: none; color: var(--muted); padding: 6px 8px; font-weight: 400; }
  .icon-btn.warn { color: #e5484d; }
  .msg { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
    background: #241f17; color: #f3eee3; font-size: 13px; padding: 10px 18px; border-radius: 999px;
    border: 1px solid var(--line); opacity: 0; transition: .25s; z-index: 30; pointer-events: none; max-width: 90vw; text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="logo" class="logo" title="Chat Boy AI"><svg viewBox="0 0 24 24" fill="none" stroke="#211806" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></div>
    <div class="title">
      <h1>Chat Boy AI</h1>
      <p id="status"><span class="dot"></span><span id="statusText">Always here to help</span></p>
    </div>
    <div class="actions">
      <button id="themeBtn" class="icon-btn" title="Theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
      <button id="bellBtn" class="icon-btn" title="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
      <button id="lockBtn" class="icon-btn" title="Lock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></button>
    </div>
  </header>

  <div id="alertBar" class="hidden"></div>
  <main id="chat"></main>

  <div id="chips">
    <button data-q="What can you do?">What can you do?</button>
    <button data-q="Tell me a joke">Tell me a joke</button>
    <button data-q="Give me a fun fact">Fun fact</button>
  </div>

  <div id="editBar" class="hidden"><span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>Editing</span><span class="q" id="editText"></span><button id="editCancel" aria-label="Cancel edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div id="replyBar" class="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg><span class="q" id="replyText"></span><button id="replyCancel" aria-label="Cancel reply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>

  <form id="composer">
    <input id="input" placeholder="Ask Chat Boy anything…" autocomplete="off" maxlength="2000"/>
    <button id="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="#211806" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg></button>
  </form>

  <button id="jumpBtn" class="hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span>New messages</span></button>
  <div id="swipeHint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg></div>
</div>

<div id="sheetWrap" class="hidden">
  <div id="sheet">
    <h2>Developer settings</h2>
    <p class="muted">Enter your API key to enable Pro replies.</p>
    <input id="apiKey" type="password" placeholder="API key" autocomplete="off"/>
    <button id="connectBtn" class="btn">Connect</button>
    <div id="sessInfo" class="hidden">
      <div>Session code: <code id="sessCode">····-····</code></div>
      <div class="muted" style="margin:6px 0 0">Both sides must show the same code.<br/>Seen messages vanish after everyone leaves.</div>
      <button id="testPushBtn" class="btn ghost" style="margin:10px 0 0">Send test notification</button>
    </div>
    <button id="closeSheet" class="btn ghost">Close</button>
  </div>
</div>

<div id="msgSheetWrap" class="hidden">
  <div id="msgSheet">
    <div id="msgSheetPreview"></div>
    <button class="msgBtn" id="msgReply"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg> <span>Reply</span></button>
    <button class="msgBtn" id="msgEdit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg> <span>Edit</span></button>
    <button class="msgBtn" id="msgCopy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> <span>Copy</span></button>
    <button class="msgBtn" id="msgSheetClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg> <span>Cancel</span></button>
  </div>
</div>

<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
